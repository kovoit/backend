version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      django:
        patterns: ["Django", "djangorestframework*", "drf-*", "django-*"]
    ignore:
      # Le projet reste sur Django 5.2 LTS : pas de saut de version majeure automatique.
      - dependency-name: "Django"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
